    <style>
        /* ── tokens ──────────────────────────────────────────── */
        :root {
            --bg:        #0D0D0D;
            --surface:   #161616;
            --surface-2: #1F1F1F;
            --border:    #2E2E2E;
            --border-hi: #F0F0F0;
            --text:      #F0F0F0;
            --muted:     #555;
            --yellow:    #F5E642;
            --red:       #E83232;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        .sr-only {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0,0,0,0); white-space: nowrap; border: 0;
        }

        body {
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            margin: 0; padding: 0; overflow: hidden;
        }

        /* grid pattern when no video loaded */
        body:not(.has-video)::before {
            content: "";
            position: fixed; inset: 0;
            background-image:
                linear-gradient(var(--surface-2) 1px, transparent 1px),
                linear-gradient(90deg, var(--surface-2) 1px, transparent 1px);
            background-size: 48px 48px;
            z-index: -1;
        }

        body.has-video { background: #000; }

        .container {
            background: transparent;
            max-width: 100vw; width: 100vw;
            margin: 0; height: 100vh; padding: 0;
            text-align: center;
            display: flex; flex-direction: column;
            box-sizing: border-box; position: relative;
        }
        .container.has-video { background: #000; }

        .container.fullscreen,
        body.fullscreen {
            border-radius: 0; padding: 0; margin: 0;
            width: 100%; height: 100vh;
            min-height: 100vh; max-height: 100vh; overflow: hidden;
        }
        .container:fullscreen,
        .container:-webkit-full-screen,

            width: 100vw; height: 100vh;

        .container.fullscreen .file-info,
        .container.fullscreen .sbs-options,
        .container.fullscreen .error-message { display: none; }
        .container.fullscreen .view-toggle { position: static; transform: none; }

        /* ── top bar ─────────────────────────────────────────── */
        .top-bar {
            position: absolute; top: 0; left: 0; right: 0;
            height: 56px;

            justify-content: space-between; gap: 12px;
            padding: 0 20px;
            background: var(--bg);
            border-bottom: 2px solid var(--border);
            z-index: 30; box-sizing: border-box;
        }
        .container.has-video .top-bar { background: rgba(10,10,10,0.92); }

        .top-bar .left, .top-bar .center, .top-bar .right {
            display: flex; align-items: center; gap: 10px;
        }
        .top-bar .left  { flex: 0 1 380px; min-width: 0; }
        .top-bar .center { flex: 0 0 auto; justify-content: center; }
        .top-bar .right { flex: 0 1 240px; justify-content: flex-end; }

        /* ── view toggle ─────────────────────────────────────── */
        .view-toggle { display: flex; gap: 0; align-items: center; }

        .view-btn {
            padding: 7px 16px;
            background: var(--surface);
            color: var(--muted);
            border: 2px solid var(--border);
            border-radius: 0;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.72em;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: color 0.1s, background 0.1s, border-color 0.1s, box-shadow 0.1s, transform 0.1s;
        }
        .view-btn:first-child { border-right: none; }
        .view-btn:hover:not(.active) {
            color: var(--text);
            border-color: var(--border-hi);
            background: var(--surface-2);
        }
        .view-btn.active {
            background: var(--yellow);
            color: var(--bg);
            border-color: var(--yellow);
            box-shadow: 3px 3px 0 rgba(245,230,66,0.35);
        }

        /* ── file input button ───────────────────────────────── */
        .file-input-wrapper { margin: 0; }

        .file-input-label {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 7px 14px;
            background: var(--surface);
            color: var(--text);
            border: 2px solid var(--border-hi);
            border-radius: 0;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.72em;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            box-shadow: 3px 3px 0 var(--border-hi);

        }
        .file-input-label:hover  { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--border-hi); }

        input[type="file"] { display: none; }

        /* ── file info ───────────────────────────────────────── */
        .file-info {
            display: flex; gap: 14px; align-items: center;

            text-transform: uppercase;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;

        .file-info p { margin: 0; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
        .file-info strong { color: var(--text); }

        /* ── page layout ─────────────────────────────────────── */
        .page-content {
            flex: 1; position: relative;
            padding-top: 56px;
            box-sizing: border-box;
            display: flex; flex-direction: column;
        }

        /* ── ad ──────────────────────────────────────────────── */

        /* ── video container ─────────────────────────────────── */
        .video-container {
            position: relative; width: 100%; height: 100%;
            min-height: 0; max-height: 100vh;
            margin: 0; background: #000;
            overflow: hidden; display: none;
            padding-bottom: 56px; box-sizing: border-box;

        .video-container.active { display: flex; flex-direction: column; }

            height: 100vh; width: 100vw;
        }
        .container.fullscreen #vrCanvas { height: 100%; min-height: 100%; width: 100vw; }
        .container.fullscreen video    { height: 100%; max-height: 100%; width: 100vw; }

        video {
            width: 100%; height: 100%; display: block;
            flex: 1; min-height: 0;
            position: absolute; inset: 0; z-index: 1;
            object-fit: contain;
        }

        .video-hidden {
            opacity: 0; pointer-events: none;
            position: absolute; width: 1px; height: 1px; left: -9999px;
        }

        #vrCanvas {
            width: 100%; height: 100%; min-height: 0;
            display: none; cursor: grab;
            position: absolute; inset: 0; z-index: 1;
        }
        #vrCanvas.active   { display: block; }
        #vrCanvas.dragging { cursor: grabbing; }

        /* ── vr info badge ───────────────────────────────────── */
        .vr-info {
            position: absolute; top: 14px; left: 14px;
            background: var(--surface);
            color: var(--muted);
            padding: 7px 12px;

            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68em;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            z-index: 10; display: none;
            transition: opacity 0.2s;
        }
        .vr-info.active { display: block; }
        .vr-info.compact .hint-text { display: none; }

        /* ── sbs options ─────────────────────────────────────── */
        .sbs-options {
            margin-top: 12px; padding: 14px 16px;
            background: var(--surface);
            border: 2px solid var(--border);
            display: none;
        }
        .sbs-options.active { display: block; }
        .sbs-options label {
            display: flex; align-items: center; gap: 10px;
            margin: 8px 0; cursor: pointer;
            font-size: 0.78em; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--muted);
        }
        .sbs-options input[type="radio"] { cursor: pointer; accent-color: var(--yellow); }

        /* ── controls bar ────────────────────────────────────── */
        .controls {
            background: var(--bg);
            border-top: 2px solid var(--border);
            padding: 0 16px;
            display: flex; align-items: center; gap: 10px;
            position: absolute; bottom: 0; left: 0; right: 0;
            z-index: 30; height: 56px;
        }

        .control-btn {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
            font-size: 0.9em;
            cursor: pointer;
            padding: 0;
            width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 2px 2px 0 var(--border);
            transition: transform 0.1s, box-shadow 0.1s, background 0.1s, border-color 0.1s, color 0.1s;
        }
        .control-btn:hover {
            background: var(--yellow); color: var(--bg);
            border-color: var(--yellow);
            box-shadow: 3px 3px 0 rgba(245,230,66,0.4);
            transform: translate(-1px,-1px);
        }
        .control-btn:active {
            transform: translate(1px,1px);
            box-shadow: 1px 1px 0 var(--border);
        }

        /* ── progress bar ────────────────────────────────────── */
        .progress-container {
            flex: 1; min-width: 120px;
            display: flex; align-items: center;
        }

        .progress-bar {
            width: 100%; height: 20px;
            background: var(--surface-2);
            border: 2px solid var(--border);
            cursor: pointer; position: relative;
        }
        .progress-bar:hover { border-color: var(--yellow); }

        .progress-fill {
            height: 100%;
            background: var(--yellow);
            width: 0%;
        }

        /* ── time display ────────────────────────────────────── */
        .time-display {
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7em;
            letter-spacing: 0.05em;
            min-width: 96px; text-align: center;
        }

        /* ── volume ──────────────────────────────────────────── */
        .volume-control { display: flex; align-items: center; gap: 8px; color: var(--muted); }
        .volume-slider  { width: 72px; accent-color: var(--yellow); cursor: pointer; }

        /* ── speed ───────────────────────────────────────────── */
        .speed-control { display: flex; align-items: center; gap: 8px; color: var(--muted); }

        .speed-select {
            background: var(--surface);
            color: var(--text);
            border: 2px solid var(--border);
            border-radius: 0;
            padding: 4px 8px;
            height: 34px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.72em;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            outline: none; cursor: pointer;
            box-shadow: 2px 2px 0 var(--border);
            transition: border-color 0.1s, box-shadow 0.1s;
        }
        .speed-select:hover { border-color: var(--yellow); box-shadow: 2px 2px 0 rgba(245,230,66,0.35); }
        .speed-select option { background: var(--surface); color: var(--text); }

        /* ── drop zone ───────────────────────────────────────── */
        .drop-zone {
            position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            width: min(480px, 88vw);
            padding: 52px 44px;
            background: var(--surface);
            border: 2px solid var(--border);
            box-shadow: 6px 6px 0 var(--surface-2);
            display: none; text-align: center;
            color: var(--muted); cursor: pointer;
            transition: border-color 0.1s, box-shadow 0.1s, color 0.1s;
        }
        .drop-zone.active { display: block; }
        .drop-zone:hover {
            border-color: var(--yellow);
            color: var(--text);
            box-shadow: 8px 8px 0 rgba(245,230,66,0.12);
        }
        .drop-zone.drag-over {
            border-color: var(--yellow);
            color: var(--text);
            box-shadow: 8px 8px 0 rgba(245,230,66,0.25);
            transform: translate(-50%, -50%) scale(1.01);
        }

        .drop-zone .drop-icon {
            font-size: 2.4em;
            margin-bottom: 20px;
            display: block;
            color: var(--border-hi);
        }
        .drop-zone .drop-primary {
            font-size: 0.9em;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: inherit;
            margin-bottom: 10px;
        }
        .drop-zone .drop-secondary {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68em;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* ── error ───────────────────────────────────────────── */
        .error-message {
            color: var(--red);
            background: #1A0808;
            border: 2px solid var(--red);
            box-shadow: 3px 3px 0 var(--red);
            padding: 12px 16px;
            margin-top: 12px;
            display: none;
            font-size: 0.78em;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .error-message.active { display: block; }

        /* ── mobile ──────────────────────────────────────────── */
        @media (max-width: 768px) {
            .controls { flex-wrap: wrap; height: auto; padding: 8px 12px; }
            .progress-container { width: 100%; order: -1; }
        }
    </style>

        }
        .file-input-label:active { transform: none; box-shadow: none; }

        /* ── error ─────────────────────────────────────────── */
        .error-message {
            margin-top: 18px; text-align: left;
            background: #fef2f0; border: 1px solid #f4c8c1; color: #c23a22;
            border-radius: 10px; box-shadow: none;
            font-size: 12.5px; font-weight: 500;
            letter-spacing: 0; text-transform: none; line-height: 1.7;
            white-space: pre-line;
        }

        /* ── sbs options: floating card over video ─────────── */
        .sbs-options {
            position: absolute; top: 76px; left: 50%;
            transform: translateX(-50%); z-index: 25;
            margin: 0; padding: 12px 20px;
            background: rgba(255,255,255,.94);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 14px;
            box-shadow: 0 10px 30px rgba(29,39,53,.12);
        }
        .sbs-options .sbs-title {
            margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--muted);
        }
        .sbs-options .sbs-row { display: flex; gap: 18px; }
        .sbs-options label {
            margin: 0; font-size: 12.5px; font-weight: 500;
            text-transform: none; letter-spacing: 0; color: var(--text);
        }
        .sbs-options input[type="radio"] { accent-color: var(--yellow); }

        /* ── vr info badge ─────────────────────────────────── */
        .vr-info {
            background: rgba(255,255,255,.88);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            color: #5a6474; border: 1px solid var(--border); border-radius: 10px;
            box-shadow: 0 6px 18px rgba(29,39,53,.10);
            font-size: 12px; letter-spacing: 0; text-transform: none;
            padding: 8px 14px;
        }

        /* ── controls: dark floating glass bar ─────────────── */
        .video-container { padding-bottom: 0; }
        .controls {
            height: auto;
            margin: 0 calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
            padding: 10px 14px;
            background: rgba(18,21,28,.78);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,.09); border-radius: 16px;
            gap: 12px;
        }
        .control-btn {
            width: 36px; height: 36px; border: none; border-radius: 10px;
            background: transparent; color: #dfe4ec; box-shadow: none; font-size: 14px;
        }
        .control-btn:hover {
            background: rgba(255,255,255,.12); color: #fff;
            border: none; box-shadow: none; transform: none;
        }
        .control-btn:active { transform: none; box-shadow: none; }
        .progress-bar {
            height: 6px; border: none; border-radius: 999px;
            background: rgba(255,255,255,.16);
        }
        .progress-bar:hover { border: none; }
        .progress-fill {
            background: var(--yellow); border-radius: 999px;
            position: relative;
        }
        /* 进度条头部的圆形滑块 */
        .progress-fill::after {
            content: ''; position: absolute; right: 0; top: 50%;
            transform: translate(35%, -50%);
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--yellow);
            box-shadow: 0 1px 5px rgba(0,0,0,.35);
        }
        .time-display { color: rgba(255,255,255,.65); font-size: 12px; }
        .volume-control, .speed-control { color: rgba(255,255,255,.65); }
        .volume-slider { accent-color: var(--yellow); }
        .speed-select {
            background: rgba(255,255,255,.10); color: #e8ecf3;
            border: 1px solid rgba(255,255,255,.14); border-radius: 8px;
            box-shadow: none; font-size: 12px; text-transform: none;
            letter-spacing: 0; height: 32px; font-family: inherit;
        }
        .speed-select:hover { border-color: rgba(255,255,255,.3); box-shadow: none; }
        .speed-select option { background: #1a1e27; color: #e8ecf3; }

        /* ── 自动播放被拦截时的中央大播放按钮 ──────────────── */
        .big-play-btn {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 28; display: none;
            width: 76px; height: 76px; border-radius: 50%;
            border: none; cursor: pointer;
            font-size: 26px; color: #fff;
            background: rgba(47,107,255,.92);
            box-shadow: 0 10px 30px rgba(0,0,0,.35);
        }
        .big-play-btn.active { display: flex; align-items: center; justify-content: center; }

        /* ── 转码快进重启时的加载提示 ───────────────────── */
        .seek-loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 29; display: none;
            align-items: center; gap: 10px;
            padding: 12px 20px; border-radius: 999px;
            background: rgba(16,20,28,.82); color: #e8ecf3;
            font-size: 13px; white-space: nowrap;
            box-shadow: 0 10px 30px rgba(0,0,0,.35);
        }
        .seek-loading.active { display: flex; }
        .seek-loading-spinner {
            width: 16px; height: 16px; flex: none;
            border: 2px solid rgba(255,255,255,.25);
            border-top-color: #fff; border-radius: 50%;
            animation: seek-spin .8s linear infinite;
        }
        @keyframes seek-spin { to { transform: rotate(360deg); } }

        /* ── 链接检测中的面板内加载提示 ─────────────────── */
        .hero-loading {
            display: none; align-items: center; justify-content: center; gap: 10px;
            margin-top: 18px; color: #5b6472; font-size: 13px;
        }
        .hero-loading.active { display: flex; }
        .hero-loading .seek-loading-spinner {
            border-color: rgba(0,0,0,.15); border-top-color: #2f6bff;
        }

        /* ── 播放列表面板 ───────────────────────────────── */
        .playlist-panel {
            position: fixed; top: 70px; right: 14px; z-index: 26;
            width: 300px; max-width: 78vw; max-height: calc(100vh - 90px);
            display: none; flex-direction: column;
            background: rgba(18,21,28,.88);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,.09); border-radius: 14px;
            color: #e8ecf3; overflow: hidden;
            box-shadow: 0 12px 32px rgba(0,0,0,.35);
        }
        .playlist-panel.active { display: flex; }
        .playlist-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; font-size: 13px; font-weight: 600;
            border-bottom: 1px solid rgba(255,255,255,.08);
        }
        .playlist-close {
            background: none; border: none; color: #9aa3b2;
            cursor: pointer; font-size: 15px; padding: 2px 6px;
        }
        .playlist-close:hover { color: #fff; }
        .playlist-items { list-style: none; margin: 0; padding: 6px; overflow-y: auto; }
        .playlist-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 12.5px;
        }
        .playlist-item:hover { background: rgba(255,255,255,.08); }
        .playlist-item.playing { background: rgba(47,107,255,.25); }
        .playlist-item.st-unresolved .pl-name,
        .playlist-item.st-missing .pl-name,
        .playlist-item.st-conflict .pl-name,
        .playlist-item.st-denied .pl-name { color: #b6bfcb; }
        .playlist-item.st-unresolved .pl-badge { background: rgba(255,196,66,.18); color: #ffd479; }
        .playlist-item.st-missing .pl-badge { background: rgba(255,92,92,.18); color: #ff9a9a; }
        .playlist-item.st-conflict .pl-badge { background: rgba(255,150,50,.18); color: #ffb37a; }
        .playlist-item.st-denied .pl-badge { background: rgba(255,92,92,.14); color: #e08d8d; }
        .playlist-item.st-remote .pl-badge { background: rgba(80,160,255,.18); color: #9cc4ff; }
        .playlist-item.st-ready .pl-badge { background: rgba(72,199,142,.16); color: #8fe0b4; }
        .pl-index { flex: none; width: 22px; color: #8a93a5; font-size: 11px; text-align: right; }
        .pl-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pl-badge {
            flex: none; font-size: 10px; padding: 2px 6px; border-radius: 6px;
            background: rgba(255,255,255,.10); color: #aab3c2;
        }
        .playlist-item.playing .pl-badge { background: rgba(47,107,255,.55); color: #fff; }
        .playlist-tools {
            display: flex; gap: 6px; padding: 8px 10px 4px;
        }
        .pl-tool-btn {
            flex: 1; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.10);
            color: #cfd6e2; font-size: 11px; padding: 5px 4px; border-radius: 7px; cursor: pointer;
            white-space: nowrap;
        }
        .pl-tool-btn:hover { background: rgba(255,255,255,.14); color: #fff; }
        .pl-tool-btn:disabled { opacity: .4; cursor: default; }
        .playlist-summary {
            margin: 4px 10px 2px; padding: 6px 8px; font-size: 11px; line-height: 1.5;
            color: #9aa3b2; background: rgba(255,255,255,.05); border-radius: 7px;
        }
        .playlist-summary.warn { color: #ffd479; background: rgba(255,196,66,.12); }
        .playlist-foot {
            padding: 7px 12px; font-size: 10.5px; color: #707a8c; text-align: center;
            border-top: 1px solid rgba(255,255,255,.07);
        }
        .hero-file-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .control-btn:disabled { opacity: .35; cursor: default; }

        /* ── touch behavior ────────────────────────────────── */
        /* 禁掉双击缩放/点按延迟；画布和进度条手势完全由 JS 接管 */
        html, body { touch-action: manipulation; }
        #vrCanvas { touch-action: none; }
        .progress-container { touch-action: none; }

        /* ── mobile (≤640px) ───────────────────────────────── */
        @media (max-width: 640px) {
            /* top bar: compact single row + 灵动岛安全区 */
            .top-bar {
                height: calc(84px + env(safe-area-inset-top));
                padding: calc(env(safe-area-inset-top) + 28px) calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));
                gap: 8px;
                transition: transform .3s ease, opacity .25s ease;
            }
            body.has-video .page-content { padding-top: calc(84px + env(safe-area-inset-top)); }
            .page-content { transition: padding-top .3s ease; }

            /* 播放时隐藏顶栏，画面铺满 */
            body.playing .top-bar {
                transform: translateY(-110%);
                opacity: 0; pointer-events: none;
            }
            body.playing .page-content { padding-top: 0; }
            .top-bar .left  { flex: 1 1 auto; min-width: 0; }
            .top-bar .center, .top-bar .right { flex: 0 0 auto; }
            .file-info { gap: 0; font-size: 11px; }
            .file-info p { max-width: 84px; }
            .file-info p:not(:first-child) { display: none; }
            .view-btn { padding: 7px 10px; font-size: 12px; white-space: nowrap; }
            .ghost-btn { padding: 8px 11px; white-space: nowrap; }
            .ghost-btn .btn-text { display: none; }   /* icon only */

            /* hero panel */
            .drop-zone {
                width: calc(100vw - 32px);
                padding: 34px 22px 28px; border-radius: 20px;
            }
            .hero-icon { font-size: 28px; margin-bottom: 10px; }
            .hero-title { font-size: 22px; }
            .hero-sub { font-size: 12.5px; margin-bottom: 22px; }
            .hero-url { flex-direction: column; align-items: stretch; }
            .hero-url input { width: 100%; font-size: 16px; }  /* ≥16px 避免 iOS 聚焦自动放大页面 */
            .hero-url .url-play-btn { width: 100%; padding: 12px; }

            /* vr hint badge: 播放时随顶栏一起隐藏 */
            .vr-info { top: 10px; left: 10px; padding: 6px 10px; font-size: 11px; transition: opacity .3s ease; }
            body.playing .vr-info { opacity: 0; pointer-events: none; }

            /* sbs floating card */
            .sbs-options { top: 66px; width: calc(100vw - 28px); padding: 10px 14px; }
            .sbs-options .sbs-row { gap: 10px; justify-content: space-between; }
            .sbs-options label { font-size: 12px; gap: 6px; }

            /* controls: two rows, big touch targets */
            .controls {
                margin: 0 calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
                padding: 8px 10px; gap: 8px; border-radius: 14px;
            }
            .control-btn { width: 40px; height: 40px; }
            /* 播放列表：移动端变为底部悬浮面板 */
            .playlist-panel {
                top: auto; left: 10px; right: 10px; bottom: 84px;
                width: auto; max-width: none; max-height: 46%;
            }
            /* 进度条强制独占第一行（flex-basis:100% 才会换行，width 无效） */
            .progress-container { flex: 1 1 100%; width: 100%; order: -1; padding: 10px 0; }
            .progress-bar { height: 8px; }
            .time-display { min-width: 0; font-size: 11px; }
            /* iOS 不允许 JS 调音量，隐藏无效滑杆 */
            .volume-control { display: none; }
            .speed-select { height: 36px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="sr-only">VR 播放器</h1>
        <p class="sr-only">在浏览器中播放本地与在线的 360° 全景、SBS（左右分屏）VR 视频，支持拖拽加载，无需上传。</p>
        <div class="top-bar">
            <div class="left">
                <div class="file-info" id="fileInfo">
                    <p><strong>文件:</strong> <span id="fileName"></span></p>
                    <p><strong>大小:</strong> <span id="fileSize"></span></p>
                    <p><strong>类型:</strong> <span id="fileType"></span></p>
                </div>
            </div>
            <div class="center">
                <div class="view-toggle">
                    <button class="view-btn" id="normalViewBtn"><i class="fa-solid fa-tv"></i>&nbsp; 普通模式</button>
                    <button class="view-btn active" id="vrViewBtn"><i class="fa-solid fa-vr-cardboard"></i>&nbsp; VR / 360</button>
                </div>
            </div>
            <div class="right">
                <button id="newVideoBtn" class="ghost-btn"><i class="fa-solid fa-plus"></i><span class="btn-text">&nbsp; 打开新视频</span></button>
            </div>
        </div>

        <div class="page-content">
            <div class="drop-zone hero active" id="dropZone">
                <div class="hero-icon"><i class="fa-solid fa-vr-cardboard"></i></div>
                <h2 class="hero-title">VR 播放器</h2>
                <p class="hero-sub">本地文件与在线直链即点即播 · 支持 360° 全景与 SBS 分屏</p>
                <div class="url-input-wrapper hero-url" id="onlineUrlSection">
                    <input type="url" id="videoUrl" placeholder="粘贴视频链接，回车播放…" spellcheck="false" autocomplete="off">
                    <button id="openUrlBtn" class="url-play-btn" title="播放链接"><i class="fa-solid fa-link"></i>&nbsp; 播放链接</button>
                </div>
                <div class="hero-divider" id="heroDivider"><span>或</span></div>
                <p class="pages-notice" id="pagesNotice">GitHub Pages 静态版：支持本地文件、文件夹和 DPL 播放；在线代理与服务器转码请使用自托管完整版或桌面版。</p>
                <div class="hero-file-row">
                    <label for="videoFile" class="file-input-label hero-file">
                        <i class="fa-solid fa-folder-open"></i>&nbsp; 打开本地文件
                    </label>
                    <label for="folderInput" class="file-input-label hero-file" id="folderLabel" title="读取整个文件夹，自动排除 50MB 以下的小文件">
                        <i class="fa-solid fa-folder-tree"></i>&nbsp; 打开文件夹
                    </label>
                    <button id="dplBtn" class="file-input-label hero-file" style="display:none" title="读取 PotPlayer 播放列表，自动在磁盘上定位视频文件">
                        <i class="fa-solid fa-list-check"></i>&nbsp; 打开 DPL 播放列表
                    </button>
                </div>
                <p class="hero-hint">也可以直接把视频文件或 .dpl 播放列表拖到这里</p>
                <button id="heroClose" class="hero-close" style="display:none"><i class="fa-solid fa-xmark"></i>&nbsp; 返回播放</button>
                <div class="hero-loading" id="heroLoading"><div class="seek-loading-spinner"></div><span id="heroLoadingText">正在检测…</span></div>
                <div class="error-message" id="errorMessage"></div>
                <button id="transcodeBtn" class="url-play-btn transcode-btn" style="display:none"><i class="fa-solid fa-gears"></i>&nbsp; 服务器转码播放（实时转为 4K H.264）</button>
                <input type="file" id="videoFile" accept="video/*,.dpl" multiple>
                <input type="file" id="folderInput" webkitdirectory multiple>
            </div>

            <div class="sbs-options" id="sbsOptions">
                <p class="sbs-title">SBS 视频格式</p>
                <div class="sbs-row">
                    <label>
                        <input type="radio" name="sbsMode" value="left" checked>
                        <span>仅左眼</span>
                    </label>
                    <label>
                        <input type="radio" name="sbsMode" value="right">
                        <span>仅右眼</span>
                    </label>
                    <label>
                        <input type="radio" name="sbsMode" value="split">
                        <span>左右分屏</span>
                    </label>
                </div>
            </div>

            <div class="video-container" id="videoContainer">
                <div class="controls">
                <button class="control-btn playlist-ctl" id="prevBtn" title="上一个" style="display:none"><i class="fa-solid fa-backward-step"></i></button>
                <button class="control-btn" id="playPauseBtn"><i class="fa-solid fa-play"></i></button>
                <button class="control-btn playlist-ctl" id="nextBtn" title="下一个" style="display:none"><i class="fa-solid fa-forward-step"></i></button>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
                </div>
                <div class="volume-control">
                    <span style="color: white;"><i class="fa-solid fa-volume-high"></i></span>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
                </div>
                <div class="speed-control">
                    <span style="color: white;"><i class="fa-solid fa-gauge-high"></i></span>
                    <select id="speedSelect" class="speed-select">
                        <option value="2">2x</option>
                        <option value="1.5">1.5x</option>
                        <option value="1" selected>1x</option>
                        <option value="0.5">0.5x</option>
                        <option value="0.25">0.25x</option>
                    </select>
                </div>
                <button class="control-btn playlist-ctl" id="playlistBtn" title="播放列表" style="display:none"><i class="fa-solid fa-list-ul"></i></button>
                <button class="control-btn" id="fullscreenBtn"><i class="fa-solid fa-expand"></i></button>
            </div>
                <div class="vr-info" id="vrInfo">
                    <i class="fa-solid fa-mouse"></i>
                    <span class="hint-text">&nbsp;拖动旋转视角 · 滚轮缩放</span>
                </div>
                <video id="videoPlayer" playsinline webkit-playsinline></video>
                <canvas id="vrCanvas"></canvas>
                <button class="big-play-btn" id="bigPlayBtn" title="播放"><i class="fa-solid fa-play"></i></button>
                <div class="seek-loading" id="seekLoading"><div class="seek-loading-spinner"></div><span id="seekLoadingText">转码加载中…</span></div>
            </div>
            <!-- 播放列表面板放在 video-container 外（fixed 定位）：
                 导入 dpl 后还没有视频加载时（全部待匹配），面板也必须可见 -->
            <div class="playlist-panel" id="playlistPanel">
                <div class="playlist-head">
                    <span id="playlistTitle">播放列表</span>
                    <button class="playlist-close" id="playlistClose" title="关闭"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="playlist-tools">
                    <button class="pl-tool-btn" id="addDirBtn" title="选择媒体文件夹，自动匹配未授权的本地条目"><i class="fa-solid fa-folder-plus"></i>&nbsp;添加媒体目录</button>
                    <button class="pl-tool-btn" id="rematchBtn" title="用已授权的目录重新匹配所有未授权条目"><i class="fa-solid fa-arrows-rotate"></i>&nbsp;重新匹配</button>
                    <button class="pl-tool-btn" id="clearListBtn" title="清空播放列表"><i class="fa-solid fa-trash-can"></i>&nbsp;清空</button>
                </div>
                <div class="playlist-summary" id="playlistSummary" style="display:none"></div>
                <ul class="playlist-items" id="playlistItems"></ul>
                <div class="playlist-foot">本地文件仅在浏览器内读取，不会上传服务器</div>
            </div>
            <input type="file" id="grantFileInput" accept="video/*" style="display:none">
            <input type="file" id="grantDirInput" webkitdirectory multiple style="display:none">
            </div>
        </div>
    </div>

    <script>
        const videoFileInput = document.getElementById('videoFile');
        const videoPlayer = document.getElementById('videoPlayer');
        const videoContainer = document.getElementById('videoContainer');
        const dropZone = document.getElementById('dropZone');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const fileType = document.getElementById('fileType');
        const errorMessage = document.getElementById('errorMessage');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeDisplay = document.getElementById('currentTime');
        const durationDisplay = document.getElementById('duration');
        const volumeSlider = document.getElementById('volumeSlider');
        const speedSelect = document.getElementById('speedSelect');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const normalViewBtn = document.getElementById('normalViewBtn');
        const vrViewBtn = document.getElementById('vrViewBtn');
        const vrCanvas = document.getElementById('vrCanvas');
        const vrInfo = document.getElementById('vrInfo');
        const sbsOptions = document.getElementById('sbsOptions');

        // VR/360 variables
        let scene, camera, renderer, sphere, videoTexture;
        let isVrMode = false;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotation = { x: 0, y: 0 };
        let isSbsVideo = false;
        let sbsMode = 'left'; // 'left', 'right', or 'split'
        let pendingVrMode = false;
        let mediaLoadGeneration = 0;
        let mediaReadyGeneration = 0;
        let vrInitPromise = null;
        let resizeListenerAttached = false;
        const baseFov = 90;
        const fullscreenFov = 90;
        const minFov = 40;
        const maxFov = 110;
        let originalVrFov = baseFov;
        let fullscreenVrFov = fullscreenFov;
        let normalVrSize = null;
        let vrInfoHideTimer = null;

        // Show drop zone initially
        dropZone.classList.add('active');

        // ── 播放辅助 ─────────────────────────────────────────
        const bigPlayBtn = document.getElementById('bigPlayBtn');

        // 自动播放尝试；被浏览器拦截（iOS 手势过期）时显示中央大播放按钮
        function tryAutoplay() {
            videoPlayer.play().catch(() => {
                bigPlayBtn.classList.add('active');
            });
        }
        bigPlayBtn.addEventListener('click', async () => {
            try {
                await videoPlayer.play();
                bigPlayBtn.classList.remove('active');
            } catch {
                bigPlayBtn.classList.add('active');
            }
        });

        // 进入 VR 的待触发标记消费。
        function consumePendingVr() {
            if (pendingVrMode) {
                pendingVrMode = false;
                enterVRView();
            }
        }

        // iOS HLS 上 loadedmetadata / loadeddata / canplay 的顺序不固定。
        // 在 load() 之前就注册全部触发器，并用 generation 防止旧片源事件串到新片源。
        function armMediaReadyTriggers(generation) {
            const onReady = async () => {
                if (generation !== mediaLoadGeneration || mediaReadyGeneration === generation) return;
                if (videoPlayer.readyState < 1 || !videoPlayer.videoWidth) return;
                mediaReadyGeneration = generation;
                isSbsVideo = await detectSBSVideo(videoPlayer);
                if (generation !== mediaLoadGeneration) return;
                sbsOptions.classList.toggle('active', isSbsVideo);
                consumePendingVr();
                tryAutoplay();
            };
            ['loadedmetadata', 'loadeddata', 'canplay'].forEach((evt) => {
                videoPlayer.addEventListener(evt, onReady, { once: true });
            });
        }

        // HLS 的 duration 可能是 Infinity：用服务端 ffprobe 探测的时长兜底
        let fallbackDuration = null;
        function effectiveDuration() {
            const d = videoPlayer.duration;
            if (d && isFinite(d)) return d;
            return fallbackDuration;
        }

        // ── 转码 HLS 会话状态（快进重启用）─────────────────
        // 转码是实时按序产出分片的，未转到的位置不存在分片，无法直接 seek。
        // 解决：快进到未转码区域时，让服务端从该时间点重新起一路转码，
        // 前端用 hlsOffset 把「会话内时间」映射回「全片时间」。
        let hlsOffset = 0;            // 当前转码会话的起始时间（秒）
        let transcodeSrcUrl = null;   // 当前转码会话的原始远程地址；非转码播放时为 null
        let transcodeDisplayName = null;
        let transcodeRestarting = false;
        let ignoreMediaError = false; // 重启转码切换流期间，忽略旧 HLS 流的报错
        const seekLoading = document.getElementById('seekLoading');
        const seekLoadingText = document.getElementById('seekLoadingText');
        function effectiveCurrentTime() {
            return transcodeSrcUrl ? hlsOffset + videoPlayer.currentTime : videoPlayer.currentTime;
        }

        // ── 播放列表（文件夹 / 多选 / .dpl 导入 + 渐进式授权）────────
        // 条目状态机：ready（已匹配本地文件）/ remote（在线链接）/
        // unresolved（未授权）/ missing（授权过目录仍未找到）/ conflict（同名冲突）
        let playlist = [];          // [{name, originalPath, normalizedPath, url, file, fileHandle, status, error}]
        let playlistIndex = -1;
        let lastDplEntries = null;  // 最近导入的 dpl 条目（用于重新匹配）
        let dplResolved = true;
        // 授权文件索引：小写 basename -> [{file, rel}]，rel 为授权目录内相对路径（规范化小写）
        const filePool = new Map();
        let activeLocalObjectURL = null;
        let grantingIndex = -1;     // 正在为哪个条目做单独授权
        // ── Electron 桌面端能力（preload 注入 window.vrDesktop；网页版为 null）──
        const isDesktopApp = !!window.vrDesktop;
        const isGitHubPages = location.hostname.endsWith('.github.io');
        let desktopDiskMap = null;  // dpl 原始路径 -> {exists, size}（桌面端磁盘检查缓存）
        const dplBtn = document.getElementById('dplBtn');
        const playlistPanel = document.getElementById('playlistPanel');
        const playlistItems = document.getElementById('playlistItems');
        const playlistTitle = document.getElementById('playlistTitle');
        const playlistSummary = document.getElementById('playlistSummary');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playlistBtn = document.getElementById('playlistBtn');
        const addDirBtn = document.getElementById('addDirBtn');
        const rematchBtn = document.getElementById('rematchBtn');
        const clearListBtn = document.getElementById('clearListBtn');
        const grantFileInput = document.getElementById('grantFileInput');
        const grantDirInput = document.getElementById('grantDirInput');

        if (isGitHubPages) {
            document.getElementById('onlineUrlSection').style.display = 'none';
            document.getElementById('heroDivider').style.display = 'none';
            document.getElementById('pagesNotice').style.display = 'block';
            document.querySelector('.hero-sub').textContent = '本地视频无需上传 · 支持 360° 全景、SBS 分屏与 DPL 播放列表';
        }

        const STATUS_BADGE = {
            ready: '本地', remote: '在线', unresolved: '未授权',
            missing: '未找到', conflict: '同名冲突', denied: '已取消',
        };
        function isPlayable(item) {
            return item && (item.status === 'ready' || (item.status === 'remote' && !isGitHubPages));
        }

        function isVideoFileName(name) {
            return /\.(mp4|m4v|webm|ogv|ogg|mov|mkv|avi|ts|m2ts|flv|wmv|3gp)$/i.test(name);
        }
        function basenameOf(p) {
            return String(p).split(/[\\/]/).filter(Boolean).pop() || String(p);
        }
        function safeDecode(s) {
            try { return decodeURIComponent(s); } catch (e) { return s; }
        }
        // 路径规范化：去引号、URL 解码、反斜杠→正斜杠、合并连续斜杠、去 ./ 、统一小写
        function normalizePath(p) {
            let s = String(p || '').trim().replace(/^["']+|["']+$/g, '');
            try { s = decodeURIComponent(s); } catch (e) {}
            return s.replace(/\\/g, '/').replace(/\/{2,}/g, '/').replace(/^\.\//, '').toLowerCase();
        }
        function addToFilePool(entries) {
            entries.forEach((entry) => {
                const f = entry.file || entry; // 兼容直接传 File
                const rel = entry.rel || normalizePath(f.webkitRelativePath || f.name);
                const key = f.name.toLowerCase();
                const bucket = filePool.get(key) || [];
                if (!bucket.some((e) => e.file === f)) bucket.push({ file: f, rel });
                filePool.set(key, bucket);

        }
        // 匹配优先级：路径后缀唯一匹配 > 文件名唯一匹配 > 冲突（不静默乱绑）
        function matchLocalEntry(originalPath) {
            const norm = normalizePath(originalPath);
            const base = norm.split('/').pop();
            const candidates = filePool.get(base) || [];
            if (!candidates.length) return null;
            const suffix = candidates.filter((c) => norm === c.rel || norm.endsWith('/' + c.rel));
            if (suffix.length === 1) return { file: suffix[0].file };
            if (suffix.length > 1) return { conflict: true };
            if (candidates.length === 1) return { file: candidates[0].file };
            return { conflict: true };
        }
        function applyMatchToItem(item) {
            const r = matchLocalEntry(item.originalPath);
            if (r && r.file) {
                item.file = r.file;
                item.status = 'ready';
                item.error = '';
            } else if (r && r.conflict) {
                item.file = null;
                item.status = 'conflict';
                item.error = '存在同名文件，请手动选择';
            } else {
                item.file = null;
                item.status = filePool.size ? 'missing' : 'unresolved';
                item.error = '';
            }
        }
        function releaseLocalObjectURL() {
            if (!activeLocalObjectURL) return;
            URL.revokeObjectURL(activeLocalObjectURL);
            activeLocalObjectURL = null;
        }
        window.addEventListener('pagehide', releaseLocalObjectURL);

        // ── 渲染 ──
        function renderPlaylist() {
            playlistItems.innerHTML = '';
            playlist.forEach((item, i) => {
                const li = document.createElement('li');
                li.className = 'playlist-item st-' + item.status
                    + (i === playlistIndex ? ' playing' : '');
                const idx = document.createElement('span');
                idx.className = 'pl-index';
                idx.textContent = i + 1;
                const name = document.createElement('span');
                name.className = 'pl-name';
                name.textContent = item.name;
                const tag = document.createElement('span');
                tag.className = 'pl-badge';
                tag.textContent = STATUS_BADGE[item.status] || item.status;
                li.append(idx, name, tag);
                li.title = item.originalPath || item.name;
                li.addEventListener('click', () => onItemClick(i)); // 所有条目都可点击
                playlistItems.appendChild(li);
            });
            playlistTitle.textContent = playlist.length ? `播放列表（${playlist.length}）` : '播放列表';
            updateSummary();
        }

        function updateSummary() {
            if (!playlist.length) {
                playlistSummary.style.display = 'none';
                return;
            }
            const total = playlist.length;
            const ready = playlist.filter(isPlayable).length;
            const need = total - ready;
            playlistSummary.classList.remove('warn');
            playlistSummary.style.display = '';
            playlistSummary.textContent = need === 0
                ? `播放列表已载入，共 ${total} 项，全部可播放。`
                : `播放列表共 ${total} 项：${ready} 项可播放，${need} 项需要授权。点击条目选择对应文件，或「添加媒体目录」自动匹配。`;
        }
        let summaryTimer = null;
        function showPlaylistBanner(text) {
            // 在面板内提示，不遮挡列表本身
            if (summaryTimer) clearTimeout(summaryTimer);
            playlistSummary.style.display = '';
            playlistSummary.classList.add('warn');
            playlistSummary.textContent = text;
            summaryTimer = setTimeout(updateSummary, 5000);
        }

        function updatePlaylistButtons() {
            const has = playlist.length > 0;
            playlistBtn.style.display = has ? '' : 'none';
            const multi = playlist.length > 1;
            prevBtn.style.display = multi ? '' : 'none';
            nextBtn.style.display = multi ? '' : 'none';
            prevBtn.disabled = playlistIndex <= 0;
            nextBtn.disabled = playlistIndex < 0 || playlistIndex >= playlist.length - 1;
            rematchBtn.disabled = !lastDplEntries;
        }

        function setPlaylist(items, startIndex) {
            // 重新匹配（dpl + 后选目录）时尽量保留当前播放位置
            const current = playlistIndex >= 0 ? playlist[playlistIndex] : null;
            playlist = items;
            playlistIndex = current ? items.findIndex((it) => it === current
                || (current.file && it.file === current.file)
                || (current.url && it.url && it.url === current.url)) : -1;
            renderPlaylist();
            updatePlaylistButtons();
            if (typeof startIndex === 'number' && isPlayable(items[startIndex])) {
                playAt(startIndex);
            }
        }

        function clearPlaylist() {
            playlist = [];
            playlistIndex = -1;
            lastDplEntries = null;
            dplResolved = true;
            filePool.clear();
            renderPlaylist();
            updatePlaylistButtons();
            playlistPanel.classList.remove('active');
        }

        // ── 播放与授权 ──
        function playResolved(item) {
            if (item.file) {
                loadVideoFile(item.file);
            } else {
                showLoadSpin('加载中…'); // 远程条目先做编码预探测，期间盖住画面
                loadVideoURL(item.url);
            }
        }
        function playAt(i) {
            const item = playlist[i];
            if (!item) return;
            playlistIndex = i;
            renderPlaylist();
            updatePlaylistButtons();
            if (isPlayable(item)) {
                playResolved(item);
            } else {
                // 未授权条目：选中并引导授权（不自动弹系统选择器）
                showPlaylistBanner(`「${item.name}」尚未授权，点击该条目选择对应文件后即可播放。`);
            }
        }
        function onItemClick(i) {
            const item = playlist[i];
            if (!item) return;
            if (isGitHubPages && item.status === 'remote') {
                playlistIndex = i;
                renderPlaylist();
                updatePlaylistButtons();
                showPlaylistBanner('GitHub Pages 静态版无法代理或转码在线条目，请使用桌面版或自托管完整版。');
                return;
            }
            if (isPlayable(item)) {
                playAt(i);
                if (isMobileDevice) playlistPanel.classList.remove('active');
            } else if (isDesktopApp && !item.url) {
                // 桌面端：点击时实时重查磁盘（文件可能刚挂载/拷入）
                playlistIndex = i;
                renderPlaylist();
                updatePlaylistButtons();
                window.vrDesktop.checkPaths([item.originalPath]).then((map) => {
                    const rec = map && map[item.originalPath];
                    if (rec && rec.exists) {
                        item.url = '/local?path=' + encodeURIComponent(item.originalPath);
                        item.status = 'ready';
                        item.error = '';
                        playAt(i);
                    } else {
                        showPlaylistBanner(`磁盘上找不到「${item.originalPath}」，请确认文件是否存在、盘符/路径是否变化。`);
                    }
                });
            } else {
                playlistIndex = i;
                renderPlaylist();
                updatePlaylistButtons();
                requestFileForItem(i); // 用户手势 → 直接弹文件选择器
            }
        }
        function stepPlaylist(step) {
            const i = playlistIndex + step;
            if (i < 0 || i >= playlist.length) return;
            playAt(i); // playAt 内部处理未授权条目：选中并提示，不静默跳过
        }
        function playNext() { stepPlaylist(1); }
        function playPrev() { stepPlaylist(-1); }

        // 单个条目授权：优先 File System Access API，回退隐藏 input
        async function requestFileForItem(i) {
            const item = playlist[i];
            if (!item) return;
            grantingIndex = i;
            if (window.showOpenFilePicker) {
                try {
                    const [handle] = await window.showOpenFilePicker({
                        id: 'vr-player-grant',
                        types: [{
                            description: '视频文件',
                            accept: { 'video/*': ['.mp4', '.m4v', '.webm', '.mov', '.mkv', '.avi', '.ts', '.m2ts', '.flv', '.wmv', '.3gp', '.ogv'] },
                        }],
                        multiple: false,
                    });
                    const file = await handle.getFile();
                    bindFileToItem(i, file, handle);
                } catch (err) {
                    // 用户取消：条目保留，状态不变，不影响其他条目
                }
                grantingIndex = -1;
            } else {
                grantFileInput.value = '';
                grantFileInput.click();
            }
        }
        function bindFileToItem(i, file, handle) {
            const item = playlist[i];
            if (!item) return;
            // 校验：文件名须与条目一致（已统一大小写、URL 编码与斜杠差异）
            const want = (item.normalizedPath || normalizePath(item.originalPath)).split('/').pop();
            const got = normalizePath(file.name);
            if (want !== got) {
                showPlaylistBanner(`选择的文件「${file.name}」与条目「${item.name}」不一致，请重新选择。`);
                return;
            }
            item.file = file;
            item.fileHandle = handle;
            item.status = 'ready';
            item.error = '';
            // 单文件选择器只给了文件名，没有可信的目录相对路径。不要把它加入
            // 全局自动匹配池，否则 DPL 中其他目录下的同名文件可能被错误绑定。
            dplResolved = playlist.every(isPlayable);
            playAt(i);
        }

        // 添加媒体目录：优先 showDirectoryPicker 递归枚举，回退 webkitdirectory
        async function addMediaDirectory() {
            if (window.showDirectoryPicker) {
                try {
                    const dirHandle = await window.showDirectoryPicker({ id: 'vr-player-media' });
                    const entries = [];
                    await enumerateDir(dirHandle, dirHandle.name, entries);
                    if (entries.length) addToFilePool(entries);
                    rematchAll(`已从「${dirHandle.name}」索引 ${entries.length} 个视频文件。`);
                } catch (err) {
                    // 用户取消目录选择：不做任何事
                }
            } else {
                grantDirInput.value = '';
                grantDirInput.click();
            }
        }
        async function enumerateDir(dirHandle, prefix, out) {
            for await (const [name, handle] of dirHandle.entries()) {
                if (name.startsWith('.')) continue;
                if (handle.kind === 'directory') {
                    await enumerateDir(handle, prefix + '/' + name, out);
                } else if (isVideoFileName(name)) {
                    const file = await handle.getFile();
                    out.push({ file, rel: normalizePath(prefix + '/' + name) });
                }
            }
        }
        // 重新匹配所有未解析条目；已成功匹配/已授权的条目不动的
        function rematchAll(note) {
            playlist.forEach((item) => {
                if (!item.url && item.status !== 'ready') applyMatchToItem(item);
            });
            dplResolved = !playlist.some((it) => !isPlayable(it));
            renderPlaylist();
            updatePlaylistButtons();
            if (note) showPlaylistBanner(note);
        }

        // 文件选择（多选 / 文件夹 / 拖放统一入口）
        // opts.minSize：过滤掉过小的文件（打开文件夹时排除样片/预告等杂文件）
        function handleFiles(fileList, opts = {}) {
            const files = Array.from(fileList || []);
            if (!files.length) return;
            const dpl = files.find((f) => /\.dpl$/i.test(f.name));
            const videos = files.filter((f) => (f.type.startsWith('video/') || isVideoFileName(f.name))
                && (!opts.minSize || f.size >= opts.minSize));
            if (videos.length) {
                videos.sort((a, b) => (a.webkitRelativePath || a.name)
                    .localeCompare(b.webkitRelativePath || b.name, 'zh-Hans-CN', { numeric: true }));
                // 普通的新选择应替换旧文件池；只有给未匹配 DPL 补文件时才累加。
                if (!dpl && !(lastDplEntries && !dplResolved)) filePool.clear();
                addToFilePool(videos);
            }
            if (dpl) {
                importDpl(dpl);
                return;
            }
            if (!videos.length) {
                showError('未找到可播放的视频文件。'
                    + (opts.minSize ? '（已排除 ' + Math.round(opts.minSize / 1024 / 1024) + 'MB 以下的小文件）' : ''));
                return;
            }
            // 之前有未完全匹配的 dpl：用新文件重新匹配；否则按新选择建列表
            if (lastDplEntries && !dplResolved) {
                rematchAll();
                return;
            }
            lastDplEntries = null;
            setPlaylist(videos.map((f) => ({
                name: f.webkitRelativePath || f.name,
                originalPath: f.webkitRelativePath || f.name,
                normalizedPath: normalizePath(f.webkitRelativePath || f.name),
                url: '', file: f, fileHandle: null, status: 'ready', error: '',
            })), 0);
        }

        // ── .dpl（PotPlayer 播放列表）解析 ──
        function readTextAuto(file) {
            // PotPlayer 的 dpl 常见为 UTF-8(BOM) 或 GBK，先试 UTF-8 严格模式
            return file.arrayBuffer().then((buf) => {
                try {
                    return new TextDecoder('utf-8', { fatal: true }).decode(buf);
                } catch (e) {
                    return new TextDecoder('gbk').decode(buf);
                }
            });
        }
        function parseDpl(text) {
            if (!/DAUMPLAYLIST/i.test(text.slice(0, 200))) {
                throw new Error('不是有效的 DPL 文件');
            }
            const map = new Map();
            text.split(/\r?\n/).forEach((line) => {
                const m = line.match(/^(\d+)\*([^*]+)\*(.*)$/);
                if (!m) return;
                const key = m[2].toLowerCase();
                if (!map.has(m[1])) map.set(m[1], {});
                map.get(m[1])[key] = m[3].trim();
            });
            return [...map.keys()].sort((a, b) => Number(a) - Number(b))
                .map((k) => map.get(k))
                .filter((e) => e.file);
        }
        async function importDpl(file) {
            let entries;
            try {
                entries = parseDpl(await readTextAuto(file));
            } catch (e) {
                showError('播放列表解析失败：' + e.message);
                return;
            }
            if (!entries.length) {
                showError('播放列表为空或格式无法识别。');
                return;
            }
            // 导入新列表时取消旧的远程探测，避免旧请求覆盖新列表状态
            urlLoadRequestId++;
            if (activeProbeController) { activeProbeController.abort(); activeProbeController = null; }
            hideHeroLoading();
            lastDplEntries = entries;
            applyDpl(true);
        }
        function entryToItem(e) {
            const rawPath = e.file;
            const title = e.title;
            if (/^https?:\/\//i.test(rawPath)) {
                return {
                    name: title || basenameOf(safeDecode(rawPath)),
                    originalPath: rawPath, normalizedPath: '',
                    url: rawPath, file: null, fileHandle: null,
                    status: 'remote', error: '',
                };
            }
            const item = {
                name: title || basenameOf(safeDecode(rawPath)),
                originalPath: rawPath, normalizedPath: normalizePath(rawPath),
                url: '', file: null, fileHandle: null,
                status: 'unresolved', error: '',
            };
            // 桌面端：dpl 里的绝对路径直接查磁盘，存在即可播（/local 流式读取）
            if (isDesktopApp) {
                const rec = desktopDiskMap && desktopDiskMap[rawPath];
                if (rec && rec.exists) {
                    item.url = '/local?path=' + encodeURIComponent(rawPath);
                    item.status = 'ready';
                } else {
                    item.status = 'missing';
                    item.error = '磁盘上找不到该文件';
