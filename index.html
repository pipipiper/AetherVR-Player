            applyMatchToItem(item);
            return item;
        }
        function applyDpl(autoplay) {
            const items = lastDplEntries.map(entryToItem);
            dplResolved = items.every(isPlayable);
            setPlaylist(items);
            dropZone.classList.remove('active'); // 收起中央遮挡层，只展示列表面板
            playlistPanel.classList.add('active');
            hideError();
            const first = items.findIndex(isPlayable);
            // 有可播放条目时首播；全部未授权也只展示列表，不遮挡、不报错
            if (first >= 0 && (autoplay || (playlistIndex === -1 && !videoPlayer.currentSrc))) {
                playAt(first);
            }
        }

        // ── Electron 桌面端：DPL 播放列表直读 ────────────────────
        // dpl 里的绝对路径由主进程查磁盘，存在即经 /local 流式播放（带 Range 可拖动）
        function decodeDplBase64(b64) {
            const bin = atob(b64);
            const buf = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
            try {
                return new TextDecoder('utf-8', { fatal: true }).decode(buf);
            } catch (e) {
                return new TextDecoder('gbk').decode(buf);
            }
        }
        async function openDplDesktop() {
            let r;
            try {
                r = await window.vrDesktop.openDpl();
            } catch (e) {
                showError('读取播放列表失败：' + e.message);
                return;
            }
            if (!r) return; // 用户取消
            let entries;
            try {
                entries = parseDpl(decodeDplBase64(r.data));
            } catch (e) {
                showError('播放列表解析失败：' + e.message);
                return;
            }
            if (!entries.length) {
                showError('播放列表为空或格式无法识别。');
                return;
            }
            // 与 importDpl 保持一致：取消旧的远程探测
            urlLoadRequestId++;
            if (activeProbeController) { activeProbeController.abort(); activeProbeController = null; }
            hideHeroLoading();
            lastDplEntries = entries;
            const localPaths = entries
                .filter((e) => !/^https?:\/\//i.test(e.file))
                .map((e) => e.file);
            try {
                desktopDiskMap = localPaths.length
                    ? await window.vrDesktop.checkPaths(localPaths)
                    : {};
            } catch (e) {
                desktopDiskMap = {};
            }
            applyDpl(true);
        }
        if (isDesktopApp && dplBtn) {
            dplBtn.style.display = '';
            dplBtn.addEventListener('click', openDplDesktop);
        }

        // 触屏设备：角标换成手势图标和触摸操作说明
        if (window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) {
            const vrInfoIcon = vrInfo.querySelector('i');
            if (vrInfoIcon) vrInfoIcon.className = 'fa-solid fa-hand-pointer';
            const vrInfoHint = vrInfo.querySelector('.hint-text');
            if (vrInfoHint) vrInfoHint.innerHTML = '&nbsp;单指拖动旋转 · 双指捏合缩放';
        }

        // Format time helper
        function formatTime(seconds) {
            if (!isFinite(seconds)) return '--:--';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Format file size helper
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // Initialize Three.js for VR/360 view
        function initVRViewer() {
            if (vrInitPromise) {
                return vrInitPromise;
            }

            vrInitPromise = new Promise((resolve) => {
                // Wait a frame so the canvas has real dimensions
                requestAnimationFrame(() => {
                    const rect = vrCanvas.getBoundingClientRect();
                    const width = rect.width || window.innerWidth;
                    const height = rect.height || window.innerHeight;

                    // Scene
                    scene = new THREE.Scene();

                    // Camera
                    camera = new THREE.PerspectiveCamera(baseFov, width / height, 0.1, 1000);
                    camera.position.set(0, 0, 0);

                    // Renderer
                    renderer = new THREE.WebGLRenderer({ canvas: vrCanvas, antialias: true });
                    renderer.setSize(width, height);
                    renderer.setPixelRatio(window.devicePixelRatio);

                    // Create sphere geometry
                    const geometry = new THREE.SphereGeometry(500, 60, 40);
                    geometry.scale(-1, 1, 1); // Invert the sphere

                    // Create video texture
                    videoTexture = new THREE.VideoTexture(videoPlayer);
                    videoTexture.minFilter = THREE.LinearFilter;
                    videoTexture.magFilter = THREE.LinearFilter;
                    videoTexture.format = THREE.RGBAFormat;

                    // Create material with video texture
                    const material = new THREE.MeshBasicMaterial({ map: videoTexture });

                    // Create mesh
                    sphere = new THREE.Mesh(geometry, material);
                    scene.add(sphere);

                    if (!resizeListenerAttached) {
                        // Handle window resize
                        window.addEventListener('resize', () => {
                            if (isVrMode && renderer) {
                                const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
                                resizeVRRenderer(!!isFullscreen);
                            }
                        });
                        resizeListenerAttached = true;
                    }

                    resolve();
                });
            });

            return vrInitPromise;
        }

        // Detect if video is SBS format (check aspect ratio)
        function detectSBSVideo(video) {
            return new Promise((resolve) => {
                const check = () => {
                    const aspectRatio = video.videoWidth / video.videoHeight;
                    // SBS videos typically have aspect ratio around 3.5:1 or higher
                    // Normal videos are usually 16:9 (1.78:1) or 4:3 (1.33:1)
                    const isSBS = aspectRatio > 2.5;
                    resolve(isSBS);
                };
                // Metadata may already be available when called from inside a
                // loadedmetadata handler — waiting for the event again would hang.
                if (video.readyState >= 1 && video.videoWidth) {
                    check();
                } else {
                    video.addEventListener('loadedmetadata', check, { once: true });
                }
            });
        }

        // Create SBS texture based on mode
        function createSBSTexture(video, mode) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // For split mode, keep original dimensions
            // For left/right, use half width
            if (mode === 'split') {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            } else {
                canvas.width = video.videoWidth / 2;
                canvas.height = video.videoHeight;
            }

            const halfWidth = video.videoWidth / 2;
            let animationFrameId = null;

            function draw() {
                if (video.readyState >= 2) {
                    if (mode === 'left') {
                        ctx.drawImage(video, 0, 0, halfWidth, video.videoHeight, 0, 0, canvas.width, canvas.height);
                    } else if (mode === 'right') {
                        ctx.drawImage(video, halfWidth, 0, halfWidth, video.videoHeight, 0, 0, canvas.width, canvas.height);
                    } else if (mode === 'split') {
                        // Draw left eye on left, right eye on right (stretched to full width)
                        ctx.drawImage(video, 0, 0, halfWidth, video.videoHeight, 0, 0, halfWidth, canvas.height);
                        ctx.drawImage(video, halfWidth, 0, halfWidth, video.videoHeight, halfWidth, 0, halfWidth, canvas.height);
                    }
                }
            }

            // Update texture
            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            texture.format = THREE.RGBAFormat;

            // Update function
            const updateTexture = () => {
                if (isVrMode && video.readyState >= 2) {
                    draw();
                    texture.needsUpdate = true;
                }
                if (isVrMode && !video.paused && !video.ended) {
                    animationFrameId = requestAnimationFrame(updateTexture);
                }
            };

            // Start updating when video plays
            const startUpdate = () => {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                updateTexture();
            };

            video.addEventListener('play', startUpdate);
            video.addEventListener('seeked', draw);
            
            // Initial draw
            if (video.readyState >= 2) {
                draw();
            }

            if (!video.paused && !video.ended) {
                startUpdate();
            }

            return texture;
        }

        // Update VR view
        function updateVRView() {
            if (!isVrMode || !renderer) return;

            // Update camera rotation
            camera.rotation.order = 'YXZ';
            camera.rotation.y = rotation.y;
            camera.rotation.x = rotation.x;

            // Update video texture
            if (videoTexture) {
                videoTexture.needsUpdate = true;
            }

            renderer.render(scene, camera);
            requestAnimationFrame(updateVRView);
        }

        function enterVRView() {
            isVrMode = true;
            videoPlayer.classList.add('video-hidden');
            vrCanvas.classList.add('active');
            vrInfo.classList.add('active');
            vrInfo.classList.remove('compact');
            normalViewBtn.classList.remove('active');
            vrViewBtn.classList.add('active');

            // Ensure controls are visible
            const controls = document.querySelector('.controls');
            if (controls) {
                controls.style.display = 'flex';
            }

            initVRViewer().then(() => {
                originalVrFov = camera ? camera.fov : baseFov;
                fullscreenVrFov = fullscreenFov;
                const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
                resizeVRRenderer(!!isFullscreen);
                // Update texture based on SBS mode
                if (isSbsVideo && sphere) {
                    const newTexture = createSBSTexture(videoPlayer, sbsMode);
                    if (sphere.material.map && sphere.material.map !== videoTexture) {
                        sphere.material.map.dispose();
                    }
                    sphere.material.map = newTexture;
                    sphere.material.needsUpdate = true;
                } else if (sphere) {
                    // Use regular video texture for non-SBS videos
                    if (sphere.material.map && sphere.material.map !== videoTexture) {
                        sphere.material.map.dispose();
                    }
                    sphere.material.map = videoTexture;
                    sphere.material.needsUpdate = true;
                }

                updateVRView();
            });

            if (vrInfoHideTimer) {
                clearTimeout(vrInfoHideTimer);
            }
            vrInfoHideTimer = setTimeout(() => {
                vrInfo.classList.add('compact');
            }, 10000);
        }

        // Switch to VR view
        function switchToVRView() {
            if (!videoPlayer.src) {
                showError('请先加载视频。');
                return;
            }

            if (videoPlayer.readyState < 2) {
                pendingVrMode = true;
                videoPlayer.addEventListener('loadeddata', () => {
                    if (pendingVrMode) {
                        pendingVrMode = false;
                        enterVRView();
                    }
                }, { once: true });
                return;
            }

            pendingVrMode = false;
            enterVRView();
        }

        // Switch to normal view
        function switchToNormalView() {
            isVrMode = false;
            videoPlayer.classList.remove('video-hidden');
            vrCanvas.classList.remove('active');
            vrInfo.classList.remove('active');
            vrInfo.classList.remove('compact');
            normalViewBtn.classList.add('active');
            vrViewBtn.classList.remove('active');
        }

        // Mouse controls for VR view
        function setupVRControls() {
            // Use Pointer Events + setPointerCapture so drag always ends
            // cleanly regardless of where the pointer is released (outside
            // window, over controls, etc.). Listening on document lets the
            // drag start even when the pointer is over the controls overlay.
            document.addEventListener('pointerdown', (e) => {
                if (!isVrMode) return;
                if (e.pointerType === 'touch') return; // handled by touch events
                if (e.button !== 0) return; // left button only
                // Only allow drag to start from the canvas area, not from any UI chrome
                // （播放列表面板、SBS 卡片、大播放按钮等也必须排除，否则
                //   setPointerCapture 会把随后的 click 事件劫持到画布上）
                if (e.target.closest('.controls, .top-bar, .vr-info, .playlist-panel, .sbs-options, .big-play-btn, .seek-loading, button, a, input, select, label')) return;
                isDragging = true;
                vrCanvas.setPointerCapture(e.pointerId);
                vrCanvas.classList.add('dragging');
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            vrCanvas.addEventListener('pointermove', (e) => {
                if (!isDragging || !isVrMode) return;
                if (e.pointerType === 'touch') return;

                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                rotation.y += deltaX * 0.002;
                rotation.x += deltaY * 0.002;

                rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotation.x));

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            const endDrag = () => {
                isDragging = false;
                vrCanvas.classList.remove('dragging');
            };

            vrCanvas.addEventListener('pointerup', endDrag);
            vrCanvas.addEventListener('pointercancel', endDrag);
            vrCanvas.addEventListener('lostpointercapture', endDrag);

            // Touch controls for mobile: 单指旋转视角，双指捏合缩放（FOV）
            let touchStart = null;
            let pinchStartDist = 0;

            function touchDistance(t) {
                return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
            }

            vrCanvas.addEventListener('touchstart', (e) => {
                if (!isVrMode) return;
                e.preventDefault();
                if (e.touches.length === 2) {
                    pinchStartDist = touchDistance(e.touches);
                    touchStart = null; // 双指期间暂停旋转
                } else if (e.touches.length === 1) {
                    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
            }, { passive: false });

            vrCanvas.addEventListener('touchmove', (e) => {
                if (!isVrMode) return;
                e.preventDefault();

                // 双指捏合 → 缩放（张开 = 拉近画面 = FOV 变小）
                if (e.touches.length === 2 && camera) {
                    const dist = touchDistance(e.touches);
                    if (pinchStartDist > 0 && dist > 0) {
                        const scale = pinchStartDist / dist;
                        const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
                        if (isFullscreen) {
                            fullscreenVrFov = Math.max(minFov, Math.min(maxFov, fullscreenVrFov * scale));
                            camera.fov = fullscreenVrFov;
                        } else {
                            originalVrFov = Math.max(minFov, Math.min(maxFov, originalVrFov * scale));
                            camera.fov = originalVrFov;
                        }
                        camera.updateProjectionMatrix();
                    }
                    pinchStartDist = dist;
                    return;
                }

                if (!touchStart) return;

                const deltaX = e.touches[0].clientX - touchStart.x;
                const deltaY = e.touches[0].clientY - touchStart.y;

                rotation.y += deltaX * 0.002;
                rotation.x += deltaY * 0.002;

                rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotation.x));

                touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }, { passive: false });

            vrCanvas.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) pinchStartDist = 0;
                // 双指抬起后剩一根手指：重置起点继续旋转，避免视角跳变
                if (e.touches.length === 1) {
                    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                } else {
                    touchStart = null;
                }
            });

            // Mouse wheel controls for FOV (zoom)
            vrCanvas.addEventListener('wheel', (e) => {
                if (!isVrMode || !camera) return;
                e.preventDefault();
                const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
                const delta = Math.sign(e.deltaY) * 2;
                if (isFullscreen) {
                    fullscreenVrFov = Math.max(minFov, Math.min(maxFov, fullscreenVrFov + delta));
                    camera.fov = fullscreenVrFov;
                } else {
                    originalVrFov = Math.max(minFov, Math.min(maxFov, originalVrFov + delta));
                    camera.fov = originalVrFov;
                }
                camera.updateProjectionMatrix();
            }, { passive: false });
        }

        // Load video file
        async function loadVideoFile(file) {
            if (!file) return;
            urlLoadRequestId++;
            if (activeProbeController) activeProbeController.abort();
            activeProbeController = null;
            hideHeroLoading();

            // Check if it's a video file (MIME type can be empty for some containers)
            const looksLikeVideo = file.type.startsWith('video/')
                || /\.(mp4|m4v|webm|ogv|ogg|mov|mkv|avi|ts|m2ts|flv|wmv|3gp)$/i.test(file.name);
            if (!looksLikeVideo) {
                showError('请选择有效的视频文件。');
                return;
            }

            // iOS「文件」App 可能把 SMB 占位文件（0 字节）直接交给网页
            if (file.size === 0) {
                showError('读取到的文件大小为 0 字节，文件尚未真正下载到本机。'
                    + (isIOSDevice ? IOS_SMB_HINT : '请确认文件已完整可用后重试。'));
                return;
            }

            // Hide drop zone and error
            dropZone.classList.remove('active');
            hideError();
            document.getElementById('transcodeBtn').style.display = 'none';
            delete videoPlayer.dataset.remoteUrl;
            fallbackDuration = null;
            hlsOffset = 0;
            transcodeSrcUrl = null;
            transcodeDisplayName = null;
            bigPlayBtn.classList.remove('active');
            isSbsVideo = false;

            // Create object URL for the video
            releaseLocalObjectURL();
            const videoURL = URL.createObjectURL(file);
            activeLocalObjectURL = videoURL;
            const generation = ++mediaLoadGeneration;
            armMediaReadyTriggers(generation);
            videoPlayer.src = videoURL;

            // Show video container
            videoContainer.classList.add('active');
            document.body.classList.add('has-video');
            document.querySelector('.container')?.classList.add('has-video');

            // Update file info
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileType.textContent = file.type || '未知';
            fileInfo.classList.add('active');

            // Reset player; VR/360 is the default view once metadata is ready
            pendingVrMode = true;
            videoPlayer.load();
            showLoadSpin(isIOSDevice ? '正在读取文件…' : '视频加载中…');
            // iOS 读取 SMB 文件可能长时间无进展：15 秒后仍无元数据就在加载提示里给出指引
            if (isIOSDevice) {
                const gen = generation;
                clearTimeout(iosReadWatchdog);
                iosReadWatchdog = setTimeout(() => {
                    if (gen !== mediaLoadGeneration) return;
                    if (videoPlayer.readyState >= 1 || videoPlayer.error) return;
                    showLoadSpin('仍在读取文件…（iPhone 正在把文件复制到本地，大文件会很慢）');
                }, 15000);
            }
        }

        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
        }

        // Hide error message
        function hideError() {
            errorMessage.classList.remove('active');
        }

        // Report unsupported codec/container instead of a silent black screen
        videoPlayer.addEventListener('error', () => {
            if (ignoreMediaError) return; // 转码快进切换流期间，旧流断开属预期
            if (!videoPlayer.currentSrc) return;
            const err = videoPlayer.error;
            let hint = '无法播放此视频：浏览器报告了媒体错误。';
            if (err && err.code === 4) {
                hint = '无法解码该视频（常见于 MKV 封装、HEVC/H.265、10-bit H.264 或 AC3/DTS 音频）。';
                if (isPhoneDevice || isTabletDevice) {
                    hint += '移动端硬解上限一般为 4K：8K HEVC 超出'
                        + (isTabletDevice ? '平板' : '手机')
                        + '硬解能力，请改用服务器转码播放，或换 4K / 1080p 的 H.264 版本。';
                } else if (isDesktopApp && window.vrDesktop.platform === 'win32') {
                    hint += 'Windows 播放 HEVC 需安装「HEVC 视频扩展」（微软商店），且显卡需支持该分辨率的硬解；安装后重启本应用再试。';
                } else if (!isSafariBrowser && !hevcPlayable) {
                    hint += '当前浏览器/系统缺少 HEVC 解码支持：Windows 请安装「HEVC 视频扩展」，macOS 请用 Safari 或最新版 Chrome。';
                }
            } else if (err && err.code === 3) {
                hint = '视频文件似乎已损坏或不完整。';
            } else if (err && err.code === 2) {
                hint = '读取视频时发生网络错误（链接可能已失效或被拒绝访问）。';
            }
            // iOS 本地文件读取失败：多半是 SMB 占位文件没下载完
            if (isIOSDevice && videoPlayer.currentSrc.startsWith('blob:')) {
                hint += '\n' + IOS_SMB_HINT;
            }
            showError(hint);
            // 报错文案在中央面板里，而视频加载后面板是隐藏的——重新弹出面板让用户看到报错
            if (!videoPlayer.paused) videoPlayer.pause();
            dropZone.classList.add('active');
            const heroCloseBtn = document.getElementById('heroClose');
            if (heroCloseBtn && videoPlayer.src) {
                heroCloseBtn.style.display = 'inline-flex';
            }
            // 编码不支持 + 源是远程链接 → 提供服务器实时转码播放入口
            const transcodeBtn = document.getElementById('transcodeBtn');
            if (transcodeBtn) {
                const remoteUrl = videoPlayer.dataset.remoteUrl || '';
                const canTranscode = err && err.code === 4
                    && /^https?:\/\//.test(remoteUrl)
                    && !remoteUrl.startsWith(location.origin);
                transcodeBtn.style.display = canTranscode ? 'inline-block' : 'none';
            }
        });

        // Network playback: route cross-origin URLs through the local proxy
        function toPlayableURL(url) {
            try {
                const u = new URL(url, location.href);
                if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
                if (u.origin === location.origin) return u.href;
                return '/proxy?url=' + encodeURIComponent(u.href);
            } catch (e) { return null; }
        }

        // ── 编码预探测：播放前判断能否直解，避免长时间黑屏 ──────────
        const isMobileDevice = window.matchMedia('(pointer: coarse)').matches
            || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const isSafariBrowser = /^((?!chrome|chromium|crios|fxios|android).)*safari/i.test(navigator.userAgent);
        // 设备分级：手机 / 平板 / 桌面。硬解能力差异主要在移动端 vs 桌面端
        const isPhoneDevice = /iPhone|iPod|Android/i.test(navigator.userAgent)
            || (window.matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600);
        const isTabletDevice = !isPhoneDevice && isMobileDevice;
        // 真实解码能力探测（比按浏览器名一刀切准确）：
        // Chrome/Edge/Electron 在 Windows（装 HEVC 扩展）和 macOS 上都能硬解 HEVC
        const capProbeVideo = document.createElement('video');
        function canPlayWithCodecs(...codecStrings) {
            return codecStrings.some((c) => {
                try { return capProbeVideo.canPlayType(`video/mp4; codecs="${c}"`) !== ''; }
                catch (e) { return false; }
            });
        }
        const hevcPlayable = canPlayWithCodecs(
            'hvc1.1.6.L150.90', 'hvc1.2.4.L150.B0', 'hev1.1.6.L150.90', 'hev1.2.4.L150.B0');
        const ac3Playable = canPlayWithCodecs('ac-3', 'ec-3');
        const isIOSDevice = /iPhone|iPad|iPod/i.test(navigator.userAgent)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        // iPhone/iPad 从「文件」App 选择 SMB 网络位置的文件时，系统必须先把整个文件
        // 复制到 Safari 沙盒（占位文件可能 0 字节、读取长时间挂起、超大文件直接失败）。
        const IOS_SMB_HINT = '如果文件来自 SMB 网络位置：iPhone 需要先把整个文件下载到本机才能交给网页，'
            + '大文件会在后台无声下载很久甚至失败。请先在「文件」App 中长按该视频 → 下载'
            + '（或拷贝到「我的 iPhone」）后重新选择；更推荐改用在线直链播放（配合服务器转码可看 8K）。';

        const heroLoading = document.getElementById('heroLoading');
        const heroLoadingText = document.getElementById('heroLoadingText');
        function showHeroLoading(text) {
            heroLoadingText.textContent = text;
            heroLoading.classList.add('active');
        }
        function hideHeroLoading() {
            heroLoading.classList.remove('active');
        }
        function showLoadSpin(text) {
            seekLoadingText.textContent = text;
            seekLoading.classList.add('active');
        }
        function hideLoadSpin() {
            seekLoading.classList.remove('active');
        }
        // 首帧就绪或出错时收起「加载中」提示
        ['loadeddata', 'canplay', 'error'].forEach((evt) => {
            videoPlayer.addEventListener(evt, hideLoadSpin);
        });

        // seeking/waiting 在任何卡顿前触发，seeked/playing/pause 负责收起。
        videoPlayer.addEventListener('seeking', () => {
            if (!transcodeRestarting) showLoadSpin('加载中…');
        });
        videoPlayer.addEventListener('seeked', hideLoadSpin);
        videoPlayer.addEventListener('waiting', () => {

        let urlLoadRequestId = 0;
        let activeProbeController = null;
        let iosReadWatchdog = null;
        async function probeRemoteMedia(url, signal, allowRetry = true) {
            try {
                const resp = await fetch('/probe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url }),
                    signal
                });
                if (resp.status === 429 && allowRetry) {
                    await new Promise((resolve) => setTimeout(resolve, 2100));
                    if (signal.aborted) return null;
                    return probeRemoteMedia(url, signal, false);
                }
                if (!resp.ok) return null;
                return await resp.json();
            } catch (e) { return null; }
        }

        // 返回 null 表示「可能能播，正常加载」；否则返回不可播原因（中文）
        function probeUnplayableReason(p) {
            if (!p || !p.video) return null;
            const vcodec = (p.video.codec || '').toLowerCase();
            const acodec = ((p.audio && p.audio.codec) || '').toLowerCase();
            const fmt = (p.formatName || '').toLowerCase();
            const w = p.video.width || 0, h = p.video.height || 0;
            if (fmt.includes('matroska') && isSafariBrowser) return 'MKV 封装格式';
            const isHevc = /(hevc|h265|h\.265)/.test(vcodec);
            // 移动端（手机/平板）先看硬解规格上限：8K HEVC 给出更具体的「超硬解」提示
            if (isHevc && isMobileDevice && (w > 4096 || h > 2160)) {
                return '超过' + (isTabletDevice ? '平板' : '手机') + '硬解能力的 ' + w + '×' + h + ' HEVC 视频';
            }
            // HEVC 是否可解看真实能力（canPlayType），不再按浏览器名一刀切
            if (isHevc && !hevcPlayable) {
                return 'HEVC/H.265 编码';
            }
            if (/(wmv|vc1|msmpeg4|mpeg2video|mpeg1video|theora|rv40|vp6)/.test(vcodec)) {
                return vcodec.toUpperCase() + ' 编码';
            }
            if (isMobileDevice && (w > 4096 || h > 2160)) {
                return '超过' + (isTabletDevice ? '平板' : '手机') + '硬解能力的 ' + w + '×' + h + ' 分辨率';
            }
            if (/(dts|truehd)/.test(acodec)) return acodec.toUpperCase() + ' 音频编码';
            if (/(ac3|eac3)/.test(acodec) && !ac3Playable) return acodec.toUpperCase() + ' 音频编码';
            return null;
        }

        async function loadVideoURL(url) {
            const requestId = ++urlLoadRequestId;
            if (activeProbeController) activeProbeController.abort();
            activeProbeController = null;
            const rawUrl = (url || '').trim();
            if (isGitHubPages && /^https?:\/\//i.test(rawUrl)) {
                hideLoadSpin();
                showError('GitHub Pages 是纯静态托管，无法代理或转码在线视频。请使用桌面版或自托管完整版。');
                dropZone.classList.add('active');
                return;
            }
            const playable = toPlayableURL(rawUrl);
            if (!playable) {
                showError('请输入有效的 http(s) 视频链接。');
                return;
            }

            // 远程链接先做编码预探测：明显播不了就直接给转码入口，
            // 不再让视频元素长时间黑屏干等 error 事件。
            const isRemoteUrl = /^https?:\/\//i.test(rawUrl) && !rawUrl.startsWith(location.origin);
            if (isRemoteUrl) {
                const controller = new AbortController();
                activeProbeController = controller;
                showHeroLoading('正在检测视频编码信息…');
                const probe = await probeRemoteMedia(rawUrl, controller.signal);
                if (requestId !== urlLoadRequestId) return;
                if (activeProbeController === controller) activeProbeController = null;
                hideHeroLoading();
                // 预检发现上游返回的根本不是视频（路径错误/签名过期/权限不足等）：
                // 直接给出具体原因，不提供转码（转码也读不到数据）
                if (probe && probe.preflight_error) {
                    hideLoadSpin();
                    showError('链接检查未通过：' + probe.preflight_error);
                    dropZone.classList.add('active');
                    return;
                }
                const reason = probeUnplayableReason(probe);
                if (reason) {
                    hideLoadSpin(); // playAt 里可能已显示「加载中…」
                    let probeName = '网络视频';
                    try {
                        probeName = decodeURIComponent(new URL(rawUrl).pathname).split('/').filter(Boolean).pop() || probeName;
                    } catch (e) {}
                    videoPlayer.dataset.remoteUrl = rawUrl;
                    videoPlayer.dataset.remoteName = probeName;
                    fileName.textContent = probeName;
                    showError('检测到' + reason + '，当前浏览器大概率无法直接播放。'
                        + '可点击下方按钮，由服务器实时转码为 4K H.264 后播放。');
                    dropZone.classList.add('active');
                    document.getElementById('transcodeBtn').style.display = 'inline-block';
                    return;
                }
                // 探测失败或判断可播：走正常加载（加载期间有「加载中」提示）
            }

            dropZone.classList.remove('active');
            hideError();
            document.getElementById('transcodeBtn').style.display = 'none';
            videoPlayer.dataset.remoteUrl = url;
            fallbackDuration = null;
            hlsOffset = 0;
            transcodeSrcUrl = null;
            transcodeDisplayName = null;
            bigPlayBtn.classList.remove('active');
            isSbsVideo = false;

            const generation = ++mediaLoadGeneration;
            armMediaReadyTriggers(generation);
            releaseLocalObjectURL();
            videoPlayer.src = playable;
            videoContainer.classList.add('active');
            document.body.classList.add('has-video');
            document.querySelector('.container')?.classList.add('has-video');

            let name = '网络视频';
            const localMatch = rawUrl.match(/^\/local\?path=(.+)$/);
            if (localMatch) {
                // 桌面端本地磁盘文件：显示真实文件名 / 大小 / 类型
                const p = safeDecode(localMatch[1]);
                name = p.split(/[\\/]/).filter(Boolean).pop() || name;
                fileName.textContent = name;
                videoPlayer.dataset.remoteName = name;
                const ext = (p.match(/\.([a-z0-9]+)$/i) || [])[1];
                fileType.textContent = ext ? ext.toUpperCase() + ' 本地文件' : '本地文件';
                fileSize.textContent = '读取中…';
                fileInfo.classList.add('active');
                // 大小经 HEAD 请求从 /local 的 Content-Length 读取
                fetch(rawUrl, { method: 'HEAD' }).then((r) => {
                    if (requestId !== urlLoadRequestId) return;
                    const len = Number(r.headers.get('Content-Length'));
                    fileSize.textContent = Number.isFinite(len) && len > 0 ? formatFileSize(len) : '本地';
                }).catch(() => {
                    if (requestId === urlLoadRequestId) fileSize.textContent = '本地';
                });
            } else {
                try {
                    name = decodeURIComponent(new URL(url).pathname).split('/').filter(Boolean).pop() || name;
                } catch (e) {}
                fileName.textContent = name;
                videoPlayer.dataset.remoteName = name;
                fileSize.textContent = '在线';
                fileType.textContent = '链接';
                fileInfo.classList.add('active');
            }

            // VR/360 is the default view once metadata is ready
            pendingVrMode = true;
            videoPlayer.load();
            showLoadSpin('视频加载中…');
        }

            if (scrubbing || transcodeRestarting) return;

        // Seek on progress bar click / touch
        let scrubbing = false;

        function posFromClientX(clientX) {
            const rect = progressBar.getBoundingClientRect();
            return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        }

        function seekFromClientX(clientX) {
            const pos = posFromClientX(clientX);
            const dur = effectiveDuration();
            if (dur) {
                // 先更新视觉：点击后进度条立即跟手（转码重启需要等几秒，
                // 不能等加载完才跳）；再执行真实跳转 / 转码重启
                progressFill.style.width = (pos * 100) + '%';
                currentTimeDisplay.textContent = formatTime(pos * dur);
                seekToGlobal(pos * dur);
            }
        }

        // 全片时间轴上的 seek：已转码区域内直接 seek（Safari 对 event 型
        // HLS 播放列表原生支持回拖）；超出已转码范围、或跳到当前会话起点
        // 之前时，让服务端从目标时间点重新起一路转码（ffmpeg -ss 快速定位）。
        function seekToGlobal(t) {
            const dur = effectiveDuration();
            if (!dur) return;
            t = Math.max(0, Math.min(t, Math.max(dur - 2, 0)));
            if (!transcodeSrcUrl) {
                videoPlayer.currentTime = t;
                return;
            }
            const local = t - hlsOffset;
            let availEnd = 0;
            try {
                const s = videoPlayer.seekable;
                if (s.length) availEnd = s.end(s.length - 1);
            } catch (e) {}
            if (local >= 0 && local <= Math.max(availEnd - 0.5, 0)) {
                videoPlayer.currentTime = local;
            } else {
                restartTranscodeAt(t);
            }
        }

        // 从指定时间点重启转码：旧会话被服务端替换，新流就绪后自动进入 VR 播放
        async function restartTranscodeAt(t, isRetry) {
            if (!transcodeSrcUrl || transcodeRestarting) return;
            transcodeRestarting = true;
            ignoreMediaError = true;
            showLoadSpin('正在跳转到 ' + formatTime(t) + '，转码加载中…');
            const doFetch = () => fetch('/transcode', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: transcodeSrcUrl, start: t })
            });
            try {
                let resp = await doFetch();
                if (resp.status === 429 && !isRetry) {
                    // 触发服务端冷却：等几秒自动重试一次（用户可接受加载一会）
                    await new Promise((r) => setTimeout(r, 5000));
                    resp = await doFetch();
                }
                const data = await resp.json();
                if (!resp.ok || !data.playlist) {
                    throw new Error(data.error || ('HTTP ' + resp.status));
                }
                const src = transcodeSrcUrl;
                const sourceDisplayName = transcodeDisplayName || '网络视频';
                const knownDuration = fallbackDuration;
                loadVideoURL(location.origin + data.playlist); // 内部会重置转码会话状态
                transcodeSrcUrl = src;
                transcodeDisplayName = sourceDisplayName;
                videoPlayer.dataset.remoteName = sourceDisplayName;
                hlsOffset = (typeof data.start === 'number' && isFinite(data.start)) ? data.start : t;
                fallbackDuration = (typeof data.duration === 'number' && isFinite(data.duration))
                    ? data.duration : knownDuration;
                fileName.textContent = sourceDisplayName + '（转码 4K）';
                hideError();
                // loadVideoURL 会把提示覆盖成「视频加载中…」，改回跳转文案；

            } catch (e) {
                hideLoadSpin();
                showError('跳转失败：' + e.message);
            } finally {
                transcodeRestarting = false;
                ignoreMediaError = false;
            }
        }

        fullscreenBtn.addEventListener('click', () => {
            const container = document.querySelector('.container');
            const fullscreenTarget = document.documentElement;
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
            
            if (!isFullscreen) {
                if (isVrMode) {
                    const rect = videoContainer.getBoundingClientRect();
                    normalVrSize = { width: rect.width, height: rect.height };
                }
                // Enter fullscreen
                if (fullscreenTarget.requestFullscreen) {
                    fullscreenTarget.requestFullscreen().catch(err => {
                        console.log('Error attempting to enable fullscreen:', err);
                    });
                } else if (fullscreenTarget.webkitRequestFullscreen) {
                    fullscreenTarget.webkitRequestFullscreen();
                } else if (fullscreenTarget.webkitRequestFullScreen) {
                    fullscreenTarget.webkitRequestFullScreen();
                } else if (fullscreenTarget.mozRequestFullScreen) {
                    fullscreenTarget.mozRequestFullScreen();
                } else if (fullscreenTarget.msRequestFullscreen) {
                    fullscreenTarget.msRequestFullscreen();
                }
            } else {
                // Exit fullscreen
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.webkitCancelFullScreen) {
                    document.webkitCancelFullScreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        });

        // Handle fullscreen changes
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('mozfullscreenchange', handleFullscreenChange);
        document.addEventListener('MSFullscreenChange', handleFullscreenChange);

        function resizeVRRenderer(useWindowSize = false) {
            if (!renderer || !camera) return;
            const targetRect = useWindowSize
                ? { width: window.innerWidth, height: window.innerHeight }
                : videoContainer.getBoundingClientRect();
            const width = targetRect.width || window.innerWidth;
            const height = targetRect.height || window.innerHeight;
            camera.fov = useWindowSize ? fullscreenVrFov : originalVrFov;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function handleFullscreenChange() {
            const container = document.querySelector('.container');
            const body = document.body;
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
            
            if (isFullscreen) {
                container.classList.add('fullscreen');
                body.classList.add('fullscreen');
                
                // Ensure controls are visible in fullscreen
                const controls = document.querySelector('.controls');
                if (controls) {
                    controls.style.display = 'flex';
                }
                
                // Resize VR canvas if in VR mode
                if (isVrMode && renderer) {
                    setTimeout(() => {
                        resizeVRRenderer(true);
                    }, 100);
                }
            } else {
                container.classList.remove('fullscreen');
                body.classList.remove('fullscreen');
                
                // Resize VR canvas if in VR mode
                if (isVrMode && renderer) {
                    setTimeout(() => {
                        if (normalVrSize && camera) {
                            camera.aspect = normalVrSize.width / normalVrSize.height;
                            camera.updateProjectionMatrix();
                            renderer.setSize(normalVrSize.width, normalVrSize.height);
                        }
                        resizeVRRenderer(false);
                        requestAnimationFrame(() => resizeVRRenderer(false));
                    }, 100);
                }
            }
        }

        // (video 'error' handling lives in the detailed listener added earlier)

        // Clean up object URL when page unloads
        window.addEventListener('beforeunload', () => {
            releaseLocalObjectURL();
        });
    </script>
</body>
</html>
