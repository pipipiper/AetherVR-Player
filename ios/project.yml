name: AetherVR
options:
  bundleIdPrefix: com.aethervr
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
packages:
  KSPlayer:
    url: https://github.com/pipipiper/KSPlayer.git
    branch: main
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    from: 4.0.3
targets:
  AetherVR:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - Info.plist
    info:
      path: Sources/Info.plist
    configFiles:
      Debug: LocalSigning.xcconfig
      Release: LocalSigning.xcconfig
    dependencies:
      - package: KSPlayer
        product: KSPlayer
      - package: AMSMB2
        product: AMSMB2
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethervr.player
        PRODUCT_NAME: AetherVR
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  AetherVR:
    build:
      targets:
        AetherVR: all
    run:
      config: Debug
